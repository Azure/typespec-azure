# Template installing all dependencies.
parameters:
  - name: nodeVersion
    type: string
    default: 24.16.0
  - name: pnpmStorePath
    type: string
    default: $(Pipeline.Workspace)/.pnpm-store
steps:
  - task: UseDotNet@2
    inputs:
      version: 8.0.x

  - task: UseNode@1
    inputs:
      version: ${{ parameters.nodeVersion }}
    displayName: Install Node.js
    retryCountOnTaskFailure: 3

  # typespec-java is in the pnpm workspace, so the repo-wide `pnpm build` builds
  # its emitter.jar and TeaVM browser target via Maven. TeaVM requires JDK 17;
  # the native emitter.jar still targets Java 11. Maven is preinstalled on the image.
  - task: JavaToolInstaller@0
    displayName: "Use Java 17"
    inputs:
      versionSpec: "17"
      jdkArchitectureOption: "x64"
      jdkSourceOption: "PreInstalled"

  - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml

  - template: /eng/common/pipelines/templates/steps/maven-authenticate.yml

  - template: /eng/common/pipelines/templates/steps/python-auth-dev-feed.yml

  - task: Cache@2
    inputs:
      key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
      path: ${{ parameters.pnpmStorePath }}
    displayName: Cache pnpm store

  - pwsh: |
      $packageJson = Get-Content -Raw "$(Build.SourcesDirectory)/package.json" | ConvertFrom-Json
      npm install -g $packageJson.packageManager # Pnpm manage-package-manager-versions will respect packageManager field
    displayName: Install pnpm

  - script: pnpm config set store-dir ${{ parameters.pnpmStorePath }}
    displayName: Setup pnpm cache dir

  - script: |
      echo "Node:"
      node -v
      echo "Pnpm:"
      pnpm -v
    displayName: "Log tool versions used"

  # purge before install to ensure a clean state between retries
  - script: pnpm install
    displayName: Install JavaScript Dependencies
    retryCountOnTaskFailure: 3
