id: pr.dependabot-core-auto-merge
name: GitOps.PullRequestIssueManagement
description: Automatically approve and merge Dependabot core submodule updates
owner:
resource: repository
disabled: false
where:
configuration:
  resourceManagementConfiguration:
    eventResponderTasks:
      - description: Approve and auto-merge Dependabot core submodule updates
        if:
          - payloadType: Pull_Request
          - hasLabel:
              label: auto-merge
          - targetsBranch:
              branch: main
          - isActivitySender:
              user: dependabot[bot]
              issueAuthor: true
        then:
          - approvePullRequest:
              comment: "Approved automatically for a Dependabot core update."
          - enableAutoMerge:
              mergeMethod: Squash

      - description: Disable auto-merge when the auto-merge label is removed
        if:
          - payloadType: Pull_Request
          - labelRemoved:
              label: auto-merge
        then:
          - disableAutoMerge
onFailure:
onSuccess:
