name: Benchmark
run-name: ${{ inputs.backfill_from != '' && format('Benchmark backfill {0}', inputs.backfill_from) || 'Benchmark' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Backfill from: commit SHA or number of recent commits. Leave empty to run a normal benchmark."
        required: false
        type: string
      backfill_to:
        description: "Inclusive ending commit. Set equal to backfill_from to benchmark one commit."
        required: false
        type: string
      backfill_force:
        description: "Replace existing historical results"
        type: boolean
        default: false
      iterations:
        description: "Measured iterations per spec"
        type: number
        default: 25
      warmup:
        description: "Warmup iterations per spec"
        type: number
        default: 3
      specs:
        description: "Optional comma-separated spec filter"
        type: string
        default: ""
      emitter_iterations:
        description: "Full-generation measurements per emitter/spec"
        type: number
        default: 3
      emitter_warmup:
        description: "Full-generation warmups per emitter/spec"
        type: number
        default: 1
      branch:
        description: "Data branch to store results (default: benchmark-data)"
        required: false
        type: string
        default: "benchmark-data"
      runner:
        description: "Runner label (for stable runs prefer self-hosted or larger dedicated runner)"
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: write

concurrency:
  group: benchmark-${{ inputs.backfill_from != '' && 'backfill' || 'main' }}-${{ github.ref }}-${{ inputs.backfill_from }}-${{ inputs.backfill_to }}
  cancel-in-progress: ${{ inputs.backfill_from == '' }}

jobs:
  run:
    uses: ./.github/workflows/benchmark-run.yml
    with:
      specs-dir: packages/benchmark/specs
      results-dir: results
      iterations: ${{ fromJSON(format('{0}', github.event_name == 'push' && 25 || inputs.iterations)) }}
      warmup: ${{ fromJSON(format('{0}', github.event_name == 'push' && 3 || inputs.warmup)) }}
      emitter-iterations: ${{ fromJSON(format('{0}', github.event_name == 'push' && 3 || inputs.emitter_iterations)) }}
      emitter-warmup: ${{ fromJSON(format('{0}', github.event_name == 'push' && 1 || inputs.emitter_warmup)) }}
      specs: ${{ inputs.specs || '' }}
      noise-cv: 0.08
      rerun-iterations: 10
      runner: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || vars.BENCHMARK_RUNNER || 'ubuntu-latest' }}
      backfill_from: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_from || '' }}
      backfill_to: ${{ inputs.backfill_to || '' }}
      backfill_force: ${{ fromJSON(format('{0}', inputs.backfill_force || false)) }}
      branch: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'benchmark-data' }}
    permissions:
      contents: write
    secrets: inherit
