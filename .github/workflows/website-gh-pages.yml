name: Deploy TypeSpec Azure Website to github pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch: {}
  # Deploy on push to main
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: pnpm install

      - name: Install browsers
        run: pnpm exec playwright install
        working-directory: packages/typespec-azure-playground-website

      - name: Build
        run: pnpm --filter "@azure-tools/typespec-azure-website..." --filter '!@typespec/website' run build
        env:
          TYPESPEC_WEBSITE_BASE_PATH: "/typespec-azure/"
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./website/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
