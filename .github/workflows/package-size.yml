name: Package Size

# Measures the published npm tarball size of every publishable package in `packages/` and
# reports the change introduced by the PR. Packages from the `core/` submodule are not
# measured: they are published from `microsoft/typespec`, not from this repo.
# This workflow only has a read-only token (it may run for
# fork PRs); the actual PR comment is posted by the `package-size-comment.yml` workflow
# which runs with `pull-requests: write` after this one completes.
# See https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

on:
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - "packages/**"
      - "eng/scripts/bundle-size/**"
      - ".github/workflows/package-size.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    name: Measure package size
    runs-on: ubuntu-latest
    env:
      TYPESPEC_VS_CI_BUILD: true
      TYPESPEC_SKIP_WEBSITE_BUILD: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ./.github/actions/setup

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      # --- Measure the PR head (current checkout is the merge result) ---
      - name: Install dependencies (head)
        run: pnpm install

      - name: Build (head)
        run: pnpm run-all build

      - name: Measure head sizes
        run: node eng/scripts/bundle-size/measure.ts --out ./temp/bundle-size/head.json

      # --- Measure the base branch ---
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: temp/bundle-size/base-checkout
          submodules: recursive

      # A separate checkout prevents head-generated files from contaminating the base build.
      # Use the head's measurement scripts even if they do not exist on the base branch.
      - name: Restore size scripts from PR head
        run: |
          mkdir -p temp/bundle-size/base-checkout/eng/scripts
          cp -R eng/scripts/bundle-size temp/bundle-size/base-checkout/eng/scripts/

      - name: Install dependencies (base)
        working-directory: temp/bundle-size/base-checkout
        run: pnpm install

      - name: Build (base)
        working-directory: temp/bundle-size/base-checkout
        run: pnpm run-all build

      - name: Measure base sizes
        working-directory: temp/bundle-size/base-checkout
        run: node eng/scripts/bundle-size/measure.ts --out "$GITHUB_WORKSPACE/temp/bundle-size/base.json"

      # --- Compare and prepare the comment payload ---
      - name: Compare sizes
        run: node eng/scripts/bundle-size/compare.ts --base ./temp/bundle-size/base.json --head ./temp/bundle-size/head.json --out ./temp/bundle-size/comment.md

      - name: Record PR number
        run: echo "${{ github.event.pull_request.number }}" > ./temp/bundle-size/pr-number.txt

      - name: Upload comment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-size-comment
          path: |
            ./temp/bundle-size/comment.md
            ./temp/bundle-size/pr-number.txt
          retention-days: 1
