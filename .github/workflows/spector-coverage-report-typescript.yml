name: "typespec-ts / Spector Coverage Report"

on:
  schedule:
    # Every Monday at 09:00 UTC+8.
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      report_only:
        description: "Only update the coverage report; do not create an implementation task"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: typespec-ts-spector-coverage-report
  cancel-in-progress: false

jobs:
  report:
    name: Generate Spector coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      issue_number: ${{ steps.update-issue.outputs.issue_number }}
      not_implemented: ${{ steps.update-issue.outputs.not_implemented }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup

      - name: Install dependencies
        run: pnpm install
        timeout-minutes: 15

      - name: Build typespec-ts package
        run: pnpm turbo run --filter "@azure-tools/typespec-ts..." build
        timeout-minutes: 20

      - name: Copy TypeSpec files
        working-directory: packages/typespec-ts
        run: pnpm copy:typespec

      - name: Run Spector tests
        working-directory: packages/typespec-ts
        run: pnpm spector-test
        timeout-minutes: 60

      - name: Create or update coverage report issue
        id: update-issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");

            const reportTitle = "[typespec-ts] Spector Coverage Report";
            const coveragePath = path.join(
              process.env.GITHUB_WORKSPACE,
              "packages/typespec-ts/coverage/spector-coverage-typescript-azure.json",
            );

            if (!fs.existsSync(coveragePath)) {
              core.setFailed(`Spector coverage file was not generated: ${coveragePath}`);
              return;
            }

            const coverage = JSON.parse(fs.readFileSync(coveragePath, "utf8"));
            if (!Array.isArray(coverage)) {
              core.setFailed("Spector coverage file must contain an array of coverage reports.");
              return;
            }

            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const reportIssue = openIssues.find(
              (issue) => issue.title === reportTitle && issue.pull_request === undefined,
            );

            const previousGroups = new Map();
            if (reportIssue?.body) {
              let currentPackage;
              for (const line of reportIssue.body.split(/\r?\n/)) {
                const packageMatch = line.match(/^### `(.+?)` \(\d+ not implemented\)$/);
                if (packageMatch) {
                  currentPackage = packageMatch[1];
                  continue;
                }

                if (!currentPackage) {
                  continue;
                }

                const rowMatch = line.match(
                  /^\|\s*(?:🆕\s*)?(?:\[`(.+?)`\]\([^)]+\)|`(.+?)`)\s*\|\s*(\d+)\s*\|\s*(\[[ xX]\])\s*\|\s*(.*?)\s*\|\s*(.*?)\s*\|$/,
                );
                if (!rowMatch) {
                  continue;
                }

                const [, linkedGroup, plainGroup, , checkbox, scenarioList, comment] = rowMatch;
                const group = linkedGroup ?? plainGroup;
                previousGroups.set(`${currentPackage}\0${group}`, {
                  skipped: checkbox.toLowerCase() === "[x]",
                  scenarios: new Set(
                    scenarioList
                      .split(",")
                      .map((scenario) => scenario.replace(/^🆕\s*/, "").trim())
                      .filter(Boolean),
                  ),
                  comment: comment.trim(),
                });
              }
            }

            const validStatuses = new Set(["pass", "fail", "not-implemented"]);
            const notImplementedByPackage = new Map();
            const summaries = [];
            const scenarioSources = new Map([
              [
                "@azure-tools/azure-http-specs",
                {
                  root: path.join(
                    process.env.GITHUB_WORKSPACE,
                    "packages/azure-http-specs/specs",
                  ),
                  url: "https://github.com/Azure/typespec-azure/tree/main/packages/azure-http-specs/specs",
                },
              ],
              [
                "@typespec/http-specs",
                {
                  root: path.join(process.env.GITHUB_WORKSPACE, "core/packages/http-specs/specs"),
                  url: "https://github.com/microsoft/typespec/tree/main/packages/http-specs/specs",
                },
              ],
            ]);

            function findMockApiFiles(root) {
              const files = [];
              for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
                const entryPath = path.join(root, entry.name);
                if (entry.isDirectory()) {
                  files.push(...findMockApiFiles(entryPath));
                } else if (entry.name === "mockapi.ts") {
                  files.push(entryPath);
                }
              }
              return files;
            }

            for (const source of scenarioSources.values()) {
              source.mockApis = findMockApiFiles(source.root).map((file) => ({
                content: fs.readFileSync(file, "utf8"),
                directory: path.relative(source.root, path.dirname(file)).split(path.sep).join("/"),
              }));
            }

            function getGroupUrl(packageName, group) {
              const source = scenarioSources.get(packageName);
              if (!source) {
                return undefined;
              }

              const registration = `Scenarios.${group}_`;
              const match = source.mockApis.find(({ content }) => content.includes(registration));
              return match ? `${source.url}/${match.directory}` : undefined;
            }

            for (const entry of coverage) {
              const packageName = entry?.scenariosMetadata?.packageName;
              const version = entry?.scenariosMetadata?.version;
              const results = entry?.results;
              if (
                typeof packageName !== "string" ||
                typeof version !== "string" ||
                !results ||
                typeof results !== "object" ||
                Array.isArray(results)
              ) {
                core.setFailed("Spector coverage file contains an invalid report entry.");
                return;
              }

              const counts = {
                pass: 0,
                fail: 0,
                "not-implemented": 0,
              };
              const groups = new Map();

              for (const [scenarioName, status] of Object.entries(results)) {
                if (!validStatuses.has(status)) {
                  core.setFailed(
                    `Scenario "${scenarioName}" has an unknown coverage status: ${status}`,
                  );
                  return;
                }
                counts[status]++;

                if (status === "not-implemented") {
                  const separator = scenarioName.lastIndexOf("_");
                  const group = separator === -1 ? scenarioName : scenarioName.slice(0, separator);
                  const scenario =
                    separator === -1 ? scenarioName : scenarioName.slice(separator + 1);
                  const scenarios = groups.get(group) ?? [];
                  scenarios.push(scenario);
                  groups.set(group, scenarios);
                }
              }

              const applicable = counts.pass + counts.fail + counts["not-implemented"];
              const percentage =
                applicable === 0 ? "100.0" : ((counts.pass / applicable) * 100).toFixed(1);
              summaries.push({
                packageName,
                version,
                total: Object.keys(results).length,
                counts,
                percentage,
              });
              notImplementedByPackage.set(packageName, groups);
            }

            const totalNotImplemented = summaries.reduce(
              (total, summary) => total + summary.counts["not-implemented"],
              0,
            );
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `# ${reportTitle} — ${today}`,
              "",
              "> Auto-generated by the **typespec-ts / Spector Coverage Report** workflow.",
              "",
              "## Summary",
              "",
              "| Package | Version | Total | ✅ Pass | ❌ Fail | 🔲 Not Implemented | Coverage |",
              "|---------|---------|------:|--------:|--------:|--------------------:|---------:|",
            ];

            for (const summary of summaries) {
              body.push(
                `| \`${summary.packageName}\` | ${summary.version} | ${summary.total} | ${summary.counts.pass} | ${summary.counts.fail} | ${summary.counts["not-implemented"]} | ${summary.percentage}% |`,
              );
            }

            body.push("", `## Not-Implemented Scenarios (${totalNotImplemented})`, "");

            if (totalNotImplemented === 0) {
              body.push("🎉 All applicable scenarios are implemented!", "");
            } else {
              for (const summary of summaries) {
                const groups = notImplementedByPackage.get(summary.packageName);
                if (!groups || groups.size === 0) {
                  continue;
                }

                body.push(
                  `### \`${summary.packageName}\` (${summary.counts["not-implemented"]} not implemented)`,
                  "",
                  "| Group | Count | Skip Implement | Scenarios | Comments |",
                  "|-------|------:|:--------------:|-----------|----------|",
                );

                for (const [group, scenarios] of [...groups.entries()].sort(([a], [b]) =>
                  a.localeCompare(b),
                )) {
                  scenarios.sort((a, b) => a.localeCompare(b));
                  const previous = previousGroups.get(`${summary.packageName}\0${group}`);
                  const isNewGroup = previousGroups.size > 0 && previous === undefined;
                  const groupUrl = getGroupUrl(summary.packageName, group);
                  const linkedGroup = groupUrl ? `[\`${group}\`](${groupUrl})` : `\`${group}\``;
                  const groupLabel = isNewGroup ? `🆕 ${linkedGroup}` : linkedGroup;
                  const scenarioLabels = scenarios.map((scenario) => {
                    const isNewScenario =
                      previousGroups.size > 0 &&
                      previous !== undefined &&
                      !previous.scenarios.has(scenario);
                    return isNewScenario ? `🆕 ${scenario}` : scenario;
                  });
                  body.push(
                    `| ${groupLabel} | ${scenarios.length} | ${previous?.skipped ? "[x]" : "[ ]"} | ${scenarioLabels.join(", ")} | ${previous?.comment ?? ""} |`,
                  );
                }

                body.push("");
              }

              body.push(
                "---",
                "> **Skip Implement:** Check `[x]` for a scenario group that should not be selected for automatic implementation. The workflow preserves checkbox state and comments on future updates.",
                "",
              );
            }

            const issueBody = body.join("\n");
            let issueNumber;
            if (reportIssue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: reportIssue.number,
                body: issueBody,
              });
              issueNumber = reportIssue.number;
              core.info(`Updated issue #${reportIssue.number} in ${owner}/${repo}.`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: reportTitle,
                body: issueBody,
              });
              issueNumber = created.data.number;
              core.info(`Created issue #${created.data.number} in ${owner}/${repo}.`);
            }

            const actionableGroups = {};
            for (const [packageName, groups] of notImplementedByPackage) {
              for (const [group, scenarios] of groups) {
                if (previousGroups.get(`${packageName}\0${group}`)?.skipped) {
                  continue;
                }
                actionableGroups[packageName] ??= {};
                actionableGroups[packageName][group] = scenarios;
              }
            }

            core.setOutput("issue_number", issueNumber);
            core.setOutput("not_implemented", JSON.stringify(actionableGroups));

  create-implementation-task:
    name: Create Spector implementation task
    needs: report
    if: >-
      needs.report.outputs.not_implemented != '{}' &&
      !(github.event_name == 'workflow_dispatch' && inputs.report_only)
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Create task issue
        uses: actions/github-script@v7
        env:
          COVERAGE_ISSUE_NUMBER: ${{ needs.report.outputs.issue_number }}
          NOT_IMPLEMENTED: ${{ needs.report.outputs.not_implemented }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const coverageIssueNumber = Number(process.env.COVERAGE_ISSUE_NUMBER);
            const notImplemented = JSON.parse(process.env.NOT_IMPLEMENTED);
            const groups = [];

            for (const [packageName, packageGroups] of Object.entries(notImplemented)) {
              for (const [group, scenarios] of Object.entries(packageGroups)) {
                groups.push({ packageName, group, scenarios });
              }
            }

            if (groups.length === 0) {
              core.info("No actionable not-implemented scenario groups were found.");
              return;
            }

            const groupList = groups
              .map(
                ({ group, scenarios }) =>
                  `- \`${group}\` (${scenarios.length} scenarios: ${scenarios.join(", ")})`,
              )
              .join("\n");
            const taskBody = [
              "## Task: Verify and Implement Spector Integration Tests",
              "",
              "Use the `spector-test-implementer` skill to verify and implement test files for the following not-implemented scenario groups.",
              "",
              "**Not-implemented scenario groups:**",
              "",
              groupList,
              "",
              "**Instructions:**",
              "",
              "1. For each scenario group above, check whether a `.test.ts` file already exists in `packages/typespec-ts/test/azure-modular-integration/`; skip groups that are already fully covered.",
              "2. For remaining groups, follow the `spector-test-implementer` workflow to generate the client and verify the generated code before writing tests.",
              "3. Read the `.tsp` and `mockapi.ts` files carefully to understand the expected behavior.",
              "4. Run each test and remove cases that fail because of emitter limitations; only commit passing tests.",
              "5. Report which tests passed and which were omitted because of emitter limitations.",
              "",
              "**PR description format:**",
              "",
              "### New test files",
              "",
              "For each newly created `.test.ts` file, use this structure:",
              "- **`Scenario_Group_Name`** — `scenario-group.test.ts`",
              "  - ✅ `scenarioName1`",
              "  - ✅ `scenarioName2`",
              "  - ❌ `scenarioName3` (reason for failure)",
              "",
              "### Updated existing test files",
              "",
              "Use the same structure for existing files updated with new scenarios.",
              "",
              "### Known skips / emitter limitations",
              "",
              "List scenarios skipped because of emitter bugs or limitations, with the reason.",
              "",
              `Results should be commented on issue ${owner}/${repo}#${coverageIssueNumber}.`,
            ].join("\n");

            const created = await github.rest.issues.create({
              owner,
              repo,
              title: `[Copilot] Verify and implement Spector tests for ${groups.length} scenario groups`,
              body: taskBody,
              labels: ["emitter:typescript"],
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: coverageIssueNumber,
              body: `🤖 A task issue has been created for ${groups.length} not-implemented scenario groups.\n\nTracking issue: #${created.data.number}`,
            });

            core.info(`Created task issue #${created.data.number} in ${owner}/${repo}.`);
