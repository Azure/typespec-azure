# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "daily"
    labels: [] # conflict with our labels in labels.ts
    # The `core` submodule points at our own repo(microsoft/typespec), so the default 3 day
    # supply-chain cooldown only delays us. Opt out of it.
    cooldown:
      default-days: 0

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - ".github/workflows/*.lock.{yaml,yml}"
    labels: [] # conflict with our labels in labels.ts
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
